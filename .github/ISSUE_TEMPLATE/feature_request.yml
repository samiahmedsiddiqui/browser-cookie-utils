name: Feature request
description: Suggest a new helper or option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you'd like to call it.
      render: js
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
